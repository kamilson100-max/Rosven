<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ROSVEN — obsessed with jewelry</title>
    <meta name="description" content="Wkrótce otwarcie sklepu stacjonarnego ROSVEN w Warszawie." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { --gold:#b08d57; --ink:#1a1a1a; }
      * { box-sizing: border-box; }
      html, body { margin:0; min-height:100%; background:#fff; color:var(--ink); font-family:Outfit,system-ui,sans-serif; }
      body { min-height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
      .stage { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
      .stage video {
        position:absolute; top:42%; left:50%;
        transform:translate(-50%,-50%);
        height:125%; width:auto; min-width:78%;
        object-fit:cover; object-position:center 8%;
        clip-path: inset(0 0 12% 0);
      }
      main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2.5rem 1.5rem 1rem; position:relative; z-index:1; }
      .content { display:flex; flex-direction:column; align-items:center; animation: rise 1.15s ease-out 1.15s both; }
      .logo { width:min(78vw,400px); height:auto; display:block; mix-blend-mode:multiply; }
      .slogan { margin:1.5rem 0 0; font-family:"Bodoni Moda",Times,serif; font-style:italic; font-size:clamp(.95rem,2.4vw,1.15rem); letter-spacing:.38em; color:var(--gold); text-transform:lowercase; }
      .line { width:4rem; height:1px; background:#c4a574; margin:2.2rem 0 0; }
      .announcement { margin:2rem 0 0; max-width:26rem; font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:#4a4a4a; line-height:1.7; }
      footer { position:relative; z-index:1; display:flex; justify-content:center; padding:0 0 2.5rem; }
      .ig { color:var(--ink); width:2.75rem; height:2.75rem; display:flex; align-items:center; justify-content:center; }
      .ig:hover { color:var(--gold); }
      @keyframes rise {
        from { opacity:0; transform:translateY(14px); }
        to { opacity:1; transform:translateY(0); }
      }
      @media (max-width: 640px) {
        .stage video { height:100%; width:100%; min-width:0; object-fit:cover; object-position:center 18%; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <video autoplay muted playsinline>
        <source src="opening.mp4" type="video/mp4" />
      </video>
    </div>
    <main>
      <div class="content">
        <img class="logo" src="logo.jpg" alt="ROSVEN" />
        <p class="slogan"></p>
        <div class="line"></div>
        <p class="announcement">Wkrótce otwarcie sklepu stacjonarnego w Warszawie</p>
      </div>
    </main>
    <footer>
      <a class="ig" href="https://www.instagram.com/rosven.pl" target="_blank" rel="noopener noreferrer" aria-label="Instagram ROSVEN">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="17.35" cy="6.65" r="0.9" fill="currentColor"/>
        </svg>
      </a>
    </footer>
  </body>
</html>
